spring.application.name=ecotrace
server.port=${PORT:8080}

# Database. Defaults to a file-based H2 database under ./data so records persist between runs.
# For PostgreSQL, add the driver dependency and set DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ecotrace-v2}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Demo mode: creates clearly labelled demonstration accounts, partners and pickups on start,
# shows the demo banner and enables the admin "reset demonstration data" action.
# Set ECOTRACE_DEMO_MODE=false for any real deployment.
ecotrace.demo-mode=${ECOTRACE_DEMO_MODE:true}
ecotrace.demo-password=${ECOTRACE_DEMO_PASSWORD:DemoPass123}

# Optional first administrator, created only when no administrator exists yet.
ecotrace.bootstrap-admin-email=${ECOTRACE_ADMIN_EMAIL:}
ecotrace.bootstrap-admin-password=${ECOTRACE_ADMIN_PASSWORD:}

# Sessions and cookies. Set ECOTRACE_COOKIE_SECURE=true when serving over HTTPS.
ecotrace.session-hours=8
ecotrace.cookie-secure=${ECOTRACE_COOKIE_SECURE:false}

# Verified handover: how long a collection code stays valid after the customer generates it.
ecotrace.handover-code-minutes=${HANDOVER_CODE_MINUTES:30}

# Handover photos are at most 3 MB; the request limit leaves room for the form fields.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Booking rules
ecotrace.slot-capacity=8
ecotrace.max-days-ahead=60

# Only needed when the frontend is served from a different origin during development
ecotrace.cors-origins=${ECOTRACE_CORS_ORIGINS:}
ecotrace.csp-enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
